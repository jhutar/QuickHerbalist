# Level definitions, in play order. Schema: docs/multi_level_design.md.
# Strict schema: unknown keys, missing keys, and sprite names not present in
# sprites.yaml are load errors. Levels beyond the last entry repeat it.
levels:
  - name: meadow
    background: grass_sprite
    distance: 1000
    start_speed: 3.0
    max_speed: 15.0
    flower:
      sprite: flower_sprite
      interval: 1.0
    stone:
      sprite: stone_sprite
      interval: 3.0
      ramp_to: 0.05
