[project]
name = "quick-herbalist"
version = "0.1.0"
description = "A quick 2D items collecting game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kivy[base]>=2.3.0",
    "pyyaml>=6.0",
]

[project.scripts]
quick-herbalist = "quick_herbalist.game:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
