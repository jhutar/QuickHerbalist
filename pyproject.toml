[project]
name = "quick-herbalist"
version = "0.1.0"
description = "A quick 2D items collecting game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Kivy 3.0.0 dev: nightly wheels from kivy.org (daily snapshot of master).
    # To pick up a newer snapshot run: uv lock --upgrade-package kivy
    # Replace with "kivy>=3.0.0" once 3.0.0 hits PyPI. The WASM/web build
    # (issue #10) uses psychowasp/kivy branch "wasm-support" instead.
    "kivy==3.0.0.dev0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pyinstaller-hooks-contrib>=2025.0",
    "pytest>=8.0",
]

[project.scripts]
manage-sprites = "quick_herbalist.tools.sprite_editor:main"
quick-herbalist = "quick_herbalist.app:main"

[[tool.uv.index]]
# Nightly wheels of kivy 3.0.0.dev0 (daily snapshot of master).
name = "kivy-nightly"
url = "https://kivy.org/downloads/simple/"
explicit = true

[tool.uv.sources]
kivy = { index = "kivy-nightly" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
