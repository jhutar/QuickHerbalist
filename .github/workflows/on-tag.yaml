name: Build Executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run tests
      run: uv run pytest -v

  # macOS builds are unsigned (no Developer ID); fine for a small project.
  # PyInstaller's kivy hook spawns an isolated child that imports the SDL2
  # window module; Kivy instantiates the window (and GL context) at import
  # time, so a display is required during the build:
  # - Linux: xvfb-run (Xvfb + software GL, preinstalled on the runner)
  # - Windows/macOS: SDL dummy video driver
  build:
    needs: sanity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'ubuntu-latest', 'macos-latest']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Build executable (Linux, under Xvfb)
      if: matrix.os == 'ubuntu-latest'
      env:
        SDL_VIDEODRIVER: x11
      run: xvfb-run -a uv run pyinstaller game.spec --clean

    - name: Build executable (Windows, macOS)
      if: matrix.os != 'ubuntu-latest'
      env:
        SDL_VIDEODRIVER: dummy
      run: uv run pyinstaller game.spec --clean

    - name: Upload artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-executables
        path: dist/

    - name: Upload artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: linux-executables
        path: dist/

    - name: Upload artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: macos-executables
        path: dist/

    - name: Attach to GitHub Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        fail_on_unmatched_files: true
