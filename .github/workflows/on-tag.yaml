name: Build Executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Kivy 3 Linux dependencies
      uses: ./.github/actions/kivy-linux-deps

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run tests
      run: uv run pytest -v

  # macOS builds are unsigned (no Developer ID); fine for a small project.
  # PyInstaller's kivy hook spawns an isolated child that imports the SDL2
  # window module; Kivy instantiates the window (and GL context) at import
  # time, so a display is required during the build:
  # - Linux: xvfb-run (Xvfb + software GL, preinstalled on the runner)
  # - Windows/macOS: SDL dummy video driver
  build:
    needs: sanity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'ubuntu-latest', 'macos-latest']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Kivy 3 Linux dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: ./.github/actions/kivy-linux-deps

    - name: Build Kivy 3 macOS dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Kivy 3 builds from source and links against frameworks that no
        # macOS image ships; build them exactly like Kivy's own OSX CI
        # (tools/build_macos_dependencies.sh at the pinned commit).
        brew install pkg-config cmake ninja meson
        SHA="0f23a55ccc59a55d2e726d079fedcca03c5ca068"
        mkdir -p .kivy-deps-scripts
        curl -fsSL -o .kivy-deps-scripts/build_macos_dependencies.sh \
          "https://raw.githubusercontent.com/kivy/kivy/${SHA}/tools/build_macos_dependencies.sh"
        curl -fsSL -o .kivy-deps-scripts/build_thorvg.sh \
          "https://raw.githubusercontent.com/kivy/kivy/${SHA}/tools/build_thorvg.sh"
        curl -fsSL -o .kivy-deps-scripts/macos_framework_wrapper.sh \
          "https://raw.githubusercontent.com/kivy/kivy/${SHA}/tools/macos_framework_wrapper.sh"
        bash .kivy-deps-scripts/build_macos_dependencies.sh
        echo "KIVY_DEPS_ROOT=$(pwd)/kivy-dependencies" >> "$GITHUB_ENV"

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Build executable (Linux, under Xvfb)
      if: matrix.os == 'ubuntu-latest'
      env:
        SDL_VIDEODRIVER: x11
      run: xvfb-run -a uv run pyinstaller game.spec --clean

    - name: Build executable (Windows, macOS)
      if: matrix.os != 'ubuntu-latest'
      env:
        SDL_VIDEODRIVER: dummy
      run: uv run pyinstaller game.spec --clean

    - name: Upload artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-executables
        path: dist/

    - name: Upload artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: linux-executables
        path: dist/

    - name: Upload artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: macos-executables
        path: dist/

    - name: Attach to GitHub Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        fail_on_unmatched_files: true

  # Static WASM bundle (Kivy 3 + pyodide) for browser play, deployed to
  # GitHub Pages. Built by web/build.sh (see web/README notes in README.md).
  web:
    needs: sanity
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure Pages
      uses: actions/configure-pages@v5

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - name: Build web bundle
      run: sh web/build.sh

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: web/dist/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
