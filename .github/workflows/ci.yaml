name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Kivy 3 Linux dependencies
      uses: ./.github/actions/kivy-linux-deps

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run tests
      run: uv run pytest -v

    # Version pinned to the ruff rev in .pre-commit-config.yaml
    - name: Lint (ruff)
      run: uvx ruff@0.15.16 check .

    - name: Format check (ruff)
      run: uvx ruff@0.15.16 format --check .
