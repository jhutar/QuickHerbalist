name: Auto-merge Dependabot

# Merges Dependabot PRs once CI passes. Only triggers for the Dependabot
# bot itself, never for human PRs.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - name: Merge when CI passes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        PR="${{ github.event.number }}"
        # Poll until every check passes. This workflow's own check is
        # excluded: it is in-progress while waiting, so it could never
        # count as passing.
        bad="1"
        for _ in $(seq 1 60); do
          out="$(gh pr checks "$PR" --json name,state,conclusion 2>/dev/null || true)"
          bad="$(printf '%s' "$out" | jq '[.[]
            | select(.name | startswith("Auto-merge") | not)
            | select(.conclusion != "SUCCESS" and .conclusion != "NEUTRAL" and .conclusion != "SKIPPED")
          ] | length')"
          [ "$bad" = "0" ] && break
          sleep 30
        done
        [ "$bad" = "0" ] || { echo "CI did not pass for PR #$PR"; exit 1; }
        gh pr merge "$PR" --merge --delete-branch
